<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<title>Enter Details!</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>
	body {
	font-family: Arial, sans-serif;
	background-color: rgb(247, 247, 247);
	text-align: center;
	}	

h1{
	text-align: center;
	font-weight: bold;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	font-size: 34px;
	color: rgb(0, 0, 0);
	z-index: 99;
}
.con{
	background: white;
	padding: 20px;
	border-radius: 10px;
	box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
	max-width: 600px;
	margin: 10px auto;
}

.con div{
	padding: 10px;
}

form label {
	display: block;
	text-align: left;
	font-weight: bold;
	margin-bottom: 5px;
}

form input {
	width: 100%;
	height: 35px;
	margin-bottom: 15px;
	padding: 5px;
	border: 1px solid #ccc;
	border-radius: 5px;
		}

.btn1-container {
	display: flex;
	justify-content: center;
	margin-top: 15px;
		}

.btn1-container input {
	padding: 10px 15px;
	font-size: 16px;
	font-weight: bold;
	color: white;
	background-color: #007bff;
	border: none;
	border-radius: 5px !Important;
	cursor: pointer;
	transition: 0.3s;
	width: 20%;
	justify-content: space-between;
		}
		
.btn1-container input:hover {
	background-color: #0056b3;
		}

	a {
	text-decoration: none;
	}
</style>

</head>
<body>
	


<div>
    <br><br>
    <h1>Employee Information</h1><br><br>
</div>

<div class="container" >

 <div class="row" style="margin:10px;font-size:20px;">

    <br><br><br>
    <div class="con">
	<h2>Add Employee</h2>
	<form th:action="@{result}"  th:object="${employee}" method="post">
	<div>
		<label>Name  :</label>
		<input type="text" id="name" class="form-control" name="name" required>
	</div>
	<div>
		<label>EId   :</label>
		<input type="text" id="eId" class="form-control" name="eId" required>
	</div>
	<div>
		<label>Age   :</label>
		<input type="text" id="age" class="form-control" name="age" required>
	</div>
	<div>
		<label>Department   :</label>
		<input type="text" id="dept" class="form-control" name="dept" required>
	</div>
	<div>
		<label>Designation   :</label>
		<input type="text" id="desi" class="form-control" name="desi" required>
	</div>
	<div>
		<label>Salary   :</label>
		<input type="text" id="sal" class="form-control" name="sal" required>
	</div>
</div>
	</br>
	<div class="btn1-container">
		<input type="submit" value="Submit"/>
	</div>
	</form>
 </div>
	
</div>
</body>
</html>
